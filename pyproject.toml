[project]
name = "adeptly-agents"
version = "0.2.0"
description = "Hierarchical multi-agent consulting team with a governance check and a human approval gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40,<2"]
anthropic = ["anthropic>=0.40,<1"]

[project.scripts]
adeptly = "adeptly.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adeptly"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
